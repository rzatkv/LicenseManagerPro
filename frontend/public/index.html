<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="License Manager Pro - manage API keys, licenses, users and system settings"
    />
    <!--
      Content Security Policy for the static frontend (v2.3). The API's
      own responses carry a stricter CSP from the backend. connect-src
      allows http:/https: because the API base URL is admin-configured
      (a fixed origin would break self-hosted installs on custom
      domains); everything else is same-origin + data: images (avatars,
      logo) only. Inline <style> tags need 'unsafe-inline'; inline
      event handlers and inline scripts are not used.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <title>License Manager Pro</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
